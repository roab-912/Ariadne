name: V0.2.0 checks
on: [push, pull_request]
jobs:
  foundations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: docker compose config --quiet
      - run: docker compose --profile verification run --build --rm tests
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: python scripts/smoke.py
      - run: npm ci
        working-directory: apps/web
      - run: npm test && npm run build
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e
        working-directory: apps/web
      - if: failure()
        run: docker compose --profile verification logs --tail 100
      - if: always()
        run: docker compose --profile verification down
